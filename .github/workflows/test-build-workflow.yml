name: Build and Test opensearch-cli
on:
  push:
    branches:
      - main
      - opensearch-*
  pull_request:
    branches:
      - main
      - opensearch-*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go ubuntu-latest
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install goimports
        run:  go install golang.org/x/tools/cmd/goimports@latest

      - name: Check out source code
        uses: actions/checkout@v6

      - name: Format check
        run: goimports -w .

      - name: Check for modified files
        id: git-check
        run: |
          echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> "$GITHUB_OUTPUT"

      - name: Display unformated changes and fail if any
        if: steps.git-check.outputs.modified == 'true'
        run: |
          echo "Found some files are dirty. Please add changes to index and ammend commit".
          git diff
          exit 1

      - name: Lint check
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

      - name: Run Unit Tests
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          go test ./...  -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: coverage.out
          flags: opensearch-cli
          name: codecov-umbrella


  build:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set up Go ${{ matrix.platform }}
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check out source code
        uses: actions/checkout@v6

      - name: Build for ${{ matrix.platform }}
        env:
          GOPROXY: "https://proxy.golang.org"
        run: go build .
